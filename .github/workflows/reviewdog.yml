name: reviewdog

on:
  pull_request:
    branches:
    - main
    paths-ignore:
    - 'configs/**'
    - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@v2
        with:
          go_version: stable
          golangci_lint_version: v2.15.0
          reporter: github-pr-review
          filter_mode: diff_context
          level: error
